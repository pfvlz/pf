; ==================== AI 智能组 ====================
; 匹配节点名中的「解锁能力标签」：
;   GPT / GPT⁺-XX  -> ChatGPT 解锁
;   GM-XX          -> Gemini 解锁
;   Grok/GRK/Gemini/ChatGPT/OpenAI/Claude -> 备用关键词，机场新增标签时自动生效
; 说明：标签里的国家码(如 GPT⁺-US)表示解锁地区，不代表节点所在地
custom_proxy_group=🤖 AI智能`url-test`(GPT|GM|Grok|GRK|Gemini|ChatGPT|OpenAI|Claude)`http://www.gstatic.com/generate_204`300,,80
; ==================== Gemini 专用组 ====================
; 只收 GM- 标签的节点(Gemini 实测可用的地区)，避免随机挑到只支持 ChatGPT 的节点
;   GM-US(11) GM-KR(4) GM-NL(3) GM-DE(3) GM-SG(3) GM-RO(3) GM-GB(2) GM-FR(2)
;   GM-BR(2) GM-AU(2) GM-CA(1) GM-TW(1) GM-IE(1) GM-RS(1) GM-JP(1)
; 注意：用 select 而非 url-test —— Gemini 对出口 IP 跳变极敏感，
;   Smart/url-test 会在节点间自动切换，Google 会判定「无法确认居住国」而拒绝服务。
;   select 固定出口，美国为首选(完全支持地区)。
custom_proxy_group=🤖 Gemini`select`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇩🇪 德国节点`[]🇳🇱 荷兰节点`[]🇬🇧 英国节点`[]🇨🇦 加拿大节点`[]🇸🇬 狮城节点`[]🚀 手动切换

